<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Photo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
.ecran{width:1366px;height:768px;box-sizing:border-box;background:#F3F5F9;color:#172033;font-family:'Lexend',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
.barre{box-sizing:border-box;padding:16px 28px;display:flex;align-items:center;gap:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:14px;border-radius:20px;font-family:inherit;font-weight:600;font-size:26px;border:3px solid transparent;cursor:pointer;min-height:72px;padding:0 28px;box-sizing:border-box;text-decoration:none}
.btn svg{width:36px;height:36px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn-maison{background:#fff;color:#172033;border-color:#C9D2DF}
.btn-second{background:#fff;color:#1D5FB4;border-color:#1D5FB4}
.btn-aide{background:#fff;color:#5B2F9E;border-color:#5B2F9E;width:112px;height:112px;border-radius:56px;flex-direction:column;gap:2px;font-size:20px;padding:0}
.btn-voix{background:#E6EEF9;color:#1D5FB4;width:80px;height:80px;border-radius:40px;padding:0;flex-shrink:0}
.equipe{font-size:24px;font-weight:600;background:#fff;border:2px solid #C9D2DF;border-radius:40px;padding:10px 24px}
.point{width:22px;height:22px;border-radius:11px;border:3px solid #1D5FB4;box-sizing:border-box}
.coin{position:absolute;width:56px;height:56px;border-color:#fff;border-style:solid;border-width:0}
</style>
</helmet>
<div class="ecran">
  <div class="barre" style="height:112px">
    <a class="btn btn-maison" href="Mission.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"></path><path d="M5 10v10h5v-6h4v6h5V10"></path></svg>Ma mission</a>
    <div style="flex:1;display:flex;justify-content:center;align-items:center;gap:12px">
      <span style="font-size:24px;font-weight:700;background:#1D5FB4;color:#fff;border-radius:14px;padding:6px 16px">Pièce 3</span>
      <div class="point" style="background:#1D5FB4"></div>
      <div class="point" style="background:#1D5FB4;width:44px"></div>
      <div class="point"></div>
      <div class="point"></div>
      <span style="font-size:24px;font-weight:600;margin-left:8px">2 sur 4</span>
    </div>
    <div class="equipe">Léa · Tom</div>
  </div>
  <div style="flex:1;display:flex;align-items:center;gap:48px;padding:0 48px">
    <div style="position:relative;width:800px;height:450px;border-radius:24px;background:#1E2836;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center">
      <div style="width:420px;height:280px;background:#F8F8F6;border-radius:6px;transform:rotate(-3deg);display:flex;align-items:center;justify-content:center">
        <div style="width:150px;height:52px;border-radius:26px;background:#9AA5B4"></div>
      </div>
      <div class="coin" style="top:24px;left:24px;border-top-width:6px;border-left-width:6px;border-top-left-radius:16px"></div>
      <div class="coin" style="top:24px;right:24px;border-top-width:6px;border-right-width:6px;border-top-right-radius:16px"></div>
      <div class="coin" style="bottom:24px;left:24px;border-bottom-width:6px;border-left-width:6px;border-bottom-left-radius:16px"></div>
      <div class="coin" style="bottom:24px;right:24px;border-bottom-width:6px;border-right-width:6px;border-bottom-right-radius:16px"></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:28px;flex:1">
      <div style="display:flex;align-items:flex-start;gap:20px">
        <p style="margin:0;font-size:46px;font-weight:700;line-height:1.2">Prends la pièce en photo.</p>
        <button class="btn btn-voix" aria-label="Lire à voix haute"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"></path><path d="M16.5 9a4 4 0 010 6"></path><path d="M19.5 6a8 8 0 010 12"></path></svg></button>
      </div>
      <p style="margin:0;font-size:26px;color:#3D4A5C;line-height:1.4">Pose-la sur la feuille blanche.<br>Les mains, oui. Les visages, non.</p>
      <a href="Pieces.dc.html" aria-label="Prendre la photo" style="align-self:flex-start;width:168px;height:168px;border-radius:84px;background:#1D5FB4;border:8px solid #fff;box-shadow:0 0 0 4px #1D5FB4, 0 8px 0 4px #123F7A;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer">
        <svg viewBox="0 0 24 24" width="84" height="84" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="4"></circle></svg>
      </a>
    </div>
  </div>
  <div class="barre" style="height:144px;justify-content:flex-end">
    <a class="btn btn-second" href="Etape.dc.html" style="margin-right:auto"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>Retour</a>
    <button class="btn btn-second" style="font-size:24px">Changer de caméra</button>
    <div style="width:40px"></div>
    <button class="btn btn-aide"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 13V6a1.5 1.5 0 013 0v5"></path><path d="M11 11V4a1.5 1.5 0 013 0v7"></path><path d="M14 11V5.5a1.5 1.5 0 013 0V12"></path><path d="M17 10a1.5 1.5 0 013 0v5a7 7 0 01-7 7h-1a7 7 0 01-5.6-2.8L3 15.5a1.6 1.6 0 012.4-2L8 16"></path></svg>Aide</button>
  </div>
</div>
</x-dc>

</body>
</html>
