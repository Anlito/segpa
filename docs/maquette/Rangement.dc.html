<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Je range</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
.ecran{width:1366px;height:768px;box-sizing:border-box;background:#F3F5F9;color:#172033;font-family:'Lexend',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
.barre{box-sizing:border-box;padding:16px 28px;display:flex;align-items:center;gap:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:14px;border-radius:20px;font-family:inherit;font-weight:600;font-size:26px;border:3px solid transparent;cursor:pointer;min-height:72px;padding:0 28px;box-sizing:border-box;text-decoration:none}
.btn svg,.ligne svg,.tuile svg{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn svg{width:36px;height:36px}
.btn-maison{background:#fff;color:#172033;border-color:#C9D2DF}
.btn-second{background:#fff;color:#1D5FB4;border-color:#1D5FB4}
.btn-principal{background:#1D5FB4;color:#fff;min-height:96px;font-size:32px;padding:0 44px;border-radius:24px;box-shadow:0 6px 0 #123F7A}
.btn-aide{background:#fff;color:#5B2F9E;border-color:#5B2F9E;width:112px;height:112px;border-radius:56px;flex-direction:column;gap:2px;font-size:20px;padding:0}
.btn-voix{background:#E6EEF9;color:#1D5FB4;width:80px;height:80px;border-radius:40px;padding:0}
.equipe{font-size:24px;font-weight:600;background:#fff;border:2px solid #C9D2DF;border-radius:40px;padding:10px 24px}
.ligne{width:100%;height:112px;border-radius:24px;background:#fff;border:3px solid #C9D2DF;display:flex;align-items:center;gap:24px;padding:0 24px;box-sizing:border-box;font-family:inherit;font-size:30px;font-weight:600;color:#172033;cursor:pointer;text-align:left}
.ligne.coche{border-color:#1E7A46;background:#F2FAF5}
.boite{width:64px;height:64px;border-radius:16px;border:4px solid #8A97AA;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-sizing:border-box}
.coche .boite{background:#1E7A46;border-color:#1E7A46;color:#fff}
.tuile{width:76px;height:76px;border-radius:20px;background:#E6EEF9;color:#1D5FB4;display:flex;align-items:center;justify-content:center;flex-shrink:0}
</style>
</helmet>
<div class="ecran">
  <div class="barre" style="height:112px">
    <a class="btn btn-maison" href="Mission.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"></path><path d="M5 10v10h5v-6h4v6h5V10"></path></svg>Ma mission</a>
    <h1 style="margin:0;font-size:40px;font-weight:700">Je range</h1>
    <button class="btn btn-voix" aria-label="Lire à voix haute"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"></path><path d="M16.5 9a4 4 0 010 6"></path><path d="M19.5 6a8 8 0 010 12"></path></svg></button>
    <div style="flex:1"></div>
    <div class="equipe">Léa · Tom</div>
  </div>
  <div style="flex:1;display:flex;align-items:center;gap:40px;padding:0 64px">
    <div style="flex:1;display:flex;flex-direction:column;gap:18px">
      <sc-for list="{{lignes}}" as="l" hint-placeholder-count="3">
        <button class="ligne {{l.classe}}" onClick="{{l.basculer}}" aria-pressed="{{l.coche}}">
          <span class="boite"><svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true" style="stroke-width:3.2"><path d="{{l.trace}}"></path></svg></span>
          <span class="tuile"><svg viewBox="0 0 24 24" width="48" height="48" aria-hidden="true"><path d="{{l.picto}}"></path></svg></span>
          {{l.texte}}
        </button>
      </sc-for>
    </div>
    <div style="width:340px;display:flex;flex-direction:column;align-items:center;gap:16px">
      <div style="width:340px;height:240px;border-radius:24px;border:4px dashed #8A97AA;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#3D4A5C;box-sizing:border-box;background:#fff">
        <svg viewBox="0 0 24 24" width="72" height="72" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="4"></circle></svg>
        <span style="font-size:24px;font-weight:600">Ma boîte fermée</span>
      </div>
      <button class="btn btn-second" style="width:100%"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="4"></circle></svg>Je prends la photo</button>
    </div>
  </div>
  <div class="barre" style="height:144px;justify-content:flex-end">
    <span style="margin-right:auto;font-size:26px;font-weight:600;color:#3D4A5C">{{compte}} sur 3</span>
    <a class="btn btn-principal" href="Bilan.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>C'est rangé</a>
    <div style="width:40px"></div>
    <button class="btn btn-aide"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 13V6a1.5 1.5 0 013 0v5"></path><path d="M11 11V4a1.5 1.5 0 013 0v7"></path><path d="M14 11V5.5a1.5 1.5 0 013 0V12"></path><path d="M17 10a1.5 1.5 0 013 0v5a7 7 0 01-7 7h-1a7 7 0 01-5.6-2.8L3 15.5a1.6 1.6 0 012.4-2L8 16"></path></svg>Aide</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1366,"height":768}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { coches: [true, false, false] };
  }
  renderVals() {
    const items = [
      { texte: 'Toutes les pièces sont dans ma boîte.', picto: 'M3 9l9-4 9 4v9l-9 4-9-4zM3 9l9 4 9-4M12 13v9' },
      { texte: 'Mon nom est sur la boîte.', picto: 'M3 12V4h8l10 10-8 8zM7.5 8.5h.01' },
      { texte: 'Ma table est propre.', picto: 'M15 3l-4 9M6 12h9l2 9H4zM8.5 16v5M12.5 16v5' },
    ];
    const c = this.state.coches;
    return {
      lignes: items.map((it, i) => ({
        ...it,
        coche: c[i] ? 'true' : 'false',
        classe: c[i] ? 'coche' : '',
        trace: c[i] ? 'M5 12.5l4.5 4.5L19 7' : '',
        basculer: () => this.setState({ coches: c.map((x, j) => (j === i ? !x : x)) }),
      })),
      compte: c.filter(Boolean).length,
    };
  }
}
</script>
</body>
</html>
