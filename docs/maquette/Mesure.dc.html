<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Je mesure</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
.ecran{width:1366px;height:768px;box-sizing:border-box;background:#F3F5F9;color:#172033;font-family:'Lexend',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
.barre{box-sizing:border-box;padding:16px 28px;display:flex;align-items:center;gap:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:14px;border-radius:20px;font-family:inherit;font-weight:600;font-size:26px;border:3px solid transparent;cursor:pointer;min-height:72px;padding:0 28px;box-sizing:border-box;text-decoration:none}
.btn svg,.msg svg{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn svg{width:36px;height:36px}
.btn-maison{background:#fff;color:#172033;border-color:#C9D2DF}
.btn-second{background:#fff;color:#1D5FB4;border-color:#1D5FB4}
.btn-principal{background:#1D5FB4;color:#fff;min-height:96px;font-size:32px;padding:0 44px;border-radius:24px;box-shadow:0 6px 0 #123F7A}
.btn-aide{background:#fff;color:#5B2F9E;border-color:#5B2F9E;width:112px;height:112px;border-radius:56px;flex-direction:column;gap:2px;font-size:20px;padding:0}
.btn-voix{background:#E6EEF9;color:#1D5FB4;width:80px;height:80px;border-radius:40px;padding:0;flex-shrink:0}
.equipe{font-size:24px;font-weight:600;background:#fff;border:2px solid #C9D2DF;border-radius:40px;padding:10px 24px}
.touche{height:84px;border-radius:20px;background:#fff;border:3px solid #C9D2DF;font-family:inherit;font-size:38px;font-weight:700;color:#172033;cursor:pointer;box-shadow:0 4px 0 #C9D2DF}
.touche:active{transform:translateY(3px);box-shadow:0 1px 0 #C9D2DF}
.msg{display:flex;align-items:center;gap:16px;border-radius:20px;padding:18px 24px;font-size:28px;font-weight:600;line-height:1.3}
</style>
</helmet>
<div class="ecran">
  <div class="barre" style="height:112px">
    <a class="btn btn-maison" href="Mission.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"></path><path d="M5 10v10h5v-6h4v6h5V10"></path></svg>Ma mission</a>
    <div style="flex:1;display:flex;justify-content:center;align-items:center;gap:16px">
      <span style="font-size:24px;font-weight:700;background:#1D5FB4;color:#fff;border-radius:14px;padding:6px 16px">Pièce 1 : le corps</span>
      <span style="font-size:24px;font-weight:600;background:#fff;border:2px solid #C9D2DF;border-radius:14px;padding:6px 16px">Pièces dehors : 1 sur 2</span>
    </div>
    <div class="equipe">Léa · Tom</div>
  </div>
  <div style="flex:1;display:flex;align-items:center;gap:56px;padding:0 64px">
    <div style="flex:1;display:flex;flex-direction:column;gap:28px">
      <div style="display:flex;align-items:flex-start;gap:20px">
        <div style="width:110px;height:110px;border-radius:28px;background:#fff;border:3px solid #C9D2DF;color:#1D5FB4;display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <svg viewBox="0 0 24 24" width="72" height="72" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><rect x="2" y="8" width="20" height="8" rx="1.5"></rect><path d="M6 8v3M10 8v4M14 8v3M18 8v4"></path></svg>
        </div>
        <p style="margin:0;font-size:44px;font-weight:700;line-height:1.2">Mesure la pièce avec ton réglet.</p>
        <button class="btn btn-voix" aria-label="Lire à voix haute"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"></path><path d="M16.5 9a4 4 0 010 6"></path><path d="M19.5 6a8 8 0 010 12"></path></svg></button>
      </div>
      <div style="display:flex;align-items:center;gap:18px;font-size:32px;font-weight:600">
        Longueur :
        <div style="min-width:200px;height:96px;border-radius:20px;background:#fff;border:4px solid #1D5FB4;display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:700;padding:0 20px;box-sizing:border-box">{{affichage}}</div>
        <span style="font-size:44px;font-weight:700">cm</span>
      </div>
      <sc-if value="{{ecart}}" hint-placeholder-val="{{false}}">
        <div class="msg" style="background:#FEF3C7;color:#78350F;border:3px solid #D97706">
          <svg viewBox="0 0 24 24" width="44" height="44" aria-hidden="true" style="flex-shrink:0"><path d="M4 12a8 8 0 0114-5.3"></path><path d="M18 3v4h-4"></path><path d="M20 12a8 8 0 01-14 5.3"></path><path d="M6 21v-4h4"></path></svg>
          Mesure encore une fois, en partant du 0 du réglet.
        </div>
      </sc-if>
      <sc-if value="{{juste}}" hint-placeholder-val="{{false}}">
        <div class="msg" style="background:#E3F2E9;color:#14532D;border:3px solid #1E7A46">
          <svg viewBox="0 0 24 24" width="44" height="44" aria-hidden="true" style="flex-shrink:0;stroke-width:3"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
          Bien mesuré !
        </div>
      </sc-if>
    </div>
    <div style="width:380px;display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:14px">
      <sc-for list="{{touches}}" as="t" hint-placeholder-count="12">
        <button class="touche" onClick="{{t.appui}}" aria-label="{{t.nom}}">{{t.libelle}}</button>
      </sc-for>
    </div>
  </div>
  <div class="barre" style="height:144px;justify-content:flex-end">
    <a class="btn btn-second" href="Pieces.dc.html" style="margin-right:auto"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>Retour</a>
    <sc-if value="{{pasEncore}}" hint-placeholder-val="{{true}}">
      <button class="btn btn-principal" onClick="{{verifier}}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>C'est mesuré</button>
    </sc-if>
    <sc-if value="{{juste}}" hint-placeholder-val="{{false}}">
      <a class="btn btn-principal" href="Rangement.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z"></path></svg>Suivant</a>
    </sc-if>
    <div style="width:40px"></div>
    <button class="btn btn-aide"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 13V6a1.5 1.5 0 013 0v5"></path><path d="M11 11V4a1.5 1.5 0 013 0v7"></path><path d="M14 11V5.5a1.5 1.5 0 013 0V12"></path><path d="M17 10a1.5 1.5 0 013 0v5a7 7 0 01-7 7h-1a7 7 0 01-5.6-2.8L3 15.5a1.6 1.6 0 012.4-2L8 16"></path></svg>Aide</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1366,"height":768}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { valeur: '9,5', verifie: true };
  }
  renderVals() {
    // Plage de démonstration seulement : la vraie viendra des mesures de Thomas (donnees/modele.js).
    const plage = [7, 8];
    const v = this.state.valeur;
    const nombre = parseFloat(v.replace(',', '.'));
    const dedans = nombre >= plage[0] && nombre <= plage[1];
    const taper = (c) => () => {
      let s = this.state.valeur;
      if (c === 'effacer') s = s.slice(0, -1);
      else if (c === ',') { if (s && !s.includes(',')) s += ','; }
      else if (s.length < 4 && !(s.includes(',') && s.split(',')[1].length >= 1)) s += c;
      this.setState({ valeur: s, verifie: false });
    };
    const touches = ['7', '8', '9', '4', '5', '6', '1', '2', '3', ',', '0', 'effacer'].map((c) => ({
      libelle: c === 'effacer' ? '⌫' : c,
      nom: c === 'effacer' ? 'Effacer' : c === ',' ? 'Virgule' : c,
      appui: taper(c),
    }));
    return {
      affichage: v || ' ',
      touches,
      ecart: this.state.verifie && v !== '' && !dedans,
      juste: this.state.verifie && dedans,
      pasEncore: !(this.state.verifie && dedans),
      verifier: () => this.setState({ verifie: true }),
    };
  }
}
</script>
</body>
</html>
