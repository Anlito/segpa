<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mon bilan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
.ecran{width:1366px;height:768px;box-sizing:border-box;background:#F3F5F9;color:#172033;font-family:'Lexend',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
.barre{box-sizing:border-box;padding:16px 28px;display:flex;align-items:center;gap:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:14px;border-radius:20px;font-family:inherit;font-weight:600;font-size:26px;border:3px solid transparent;cursor:pointer;min-height:72px;padding:0 28px;box-sizing:border-box;text-decoration:none}
.btn svg,.visage svg{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn svg{width:36px;height:36px}
.btn-maison{background:#fff;color:#172033;border-color:#C9D2DF}
.btn-principal{background:#1D5FB4;color:#fff;min-height:96px;font-size:32px;padding:0 44px;border-radius:24px;box-shadow:0 6px 0 #123F7A}
.btn-aide{background:#fff;color:#5B2F9E;border-color:#5B2F9E;width:112px;height:112px;border-radius:56px;flex-direction:column;gap:2px;font-size:20px;padding:0}
.btn-voix{background:#E6EEF9;color:#1D5FB4;width:72px;height:72px;border-radius:36px;padding:0;flex-shrink:0}
.equipe{font-size:24px;font-weight:600;background:#fff;border:2px solid #C9D2DF;border-radius:40px;padding:10px 24px}
.question{background:#fff;border-radius:28px;border:3px solid #C9D2DF;padding:20px 28px;display:flex;align-items:center;gap:24px}
.visage{width:150px;height:150px;border-radius:24px;border:3px solid #C9D2DF;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-family:inherit;font-size:22px;font-weight:600;color:#172033;cursor:pointer;box-sizing:border-box}
.visage.choisi{border-width:5px;border-color:#1D5FB4;background:#E6EEF9;color:#123F7A}
</style>
</helmet>
<div class="ecran">
  <div class="barre" style="height:112px">
    <a class="btn btn-maison" href="Mission.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"></path><path d="M5 10v10h5v-6h4v6h5V10"></path></svg>Ma mission</a>
    <h1 style="margin:0;font-size:40px;font-weight:700">Mon bilan</h1>
    <div style="flex:1"></div>
    <div class="equipe">Léa · Tom</div>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:24px;padding:0 64px">
    <sc-for list="{{questions}}" as="q" hint-placeholder-count="2">
      <div class="question">
        <p style="margin:0;flex:1;font-size:34px;font-weight:700;line-height:1.25">{{q.texte}}</p>
        <button class="btn btn-voix" aria-label="Lire à voix haute"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"></path><path d="M16.5 9a4 4 0 010 6"></path><path d="M19.5 6a8 8 0 010 12"></path></svg></button>
        <sc-for list="{{q.choix}}" as="c" hint-placeholder-count="3">
          <button class="visage {{c.classe}}" onClick="{{c.choisir}}" aria-pressed="{{c.presse}}">
            <svg viewBox="0 0 24 24" width="80" height="80" aria-hidden="true"><circle cx="12" cy="12" r="9.5"></circle><circle cx="8.8" cy="10" r="0.6" style="fill:currentColor"></circle><circle cx="15.2" cy="10" r="0.6" style="fill:currentColor"></circle><path d="{{c.bouche}}"></path></svg>
            {{c.mot}}
          </button>
        </sc-for>
      </div>
    </sc-for>
  </div>
  <div class="barre" style="height:144px;justify-content:flex-end">
    <a class="btn btn-principal" href="Bravo.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>C'est fait</a>
    <div style="width:40px"></div>
    <button class="btn btn-aide"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 13V6a1.5 1.5 0 013 0v5"></path><path d="M11 11V4a1.5 1.5 0 013 0v7"></path><path d="M14 11V5.5a1.5 1.5 0 013 0V12"></path><path d="M17 10a1.5 1.5 0 013 0v5a7 7 0 01-7 7h-1a7 7 0 01-5.6-2.8L3 15.5a1.6 1.6 0 012.4-2L8 16"></path></svg>Aide</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1366,"height":768}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { reponses: [0, null] };
  }
  renderVals() {
    const textes = ["J'ai réussi à démonter puis remonter mon objet.", "J'ai travaillé en équipe avec mon binôme."];
    const visages = [
      { mot: 'Oui', bouche: 'M7.5 14.5c1.2 2 2.7 3 4.5 3s3.3-1 4.5-3' },
      { mot: 'Un peu', bouche: 'M8 15.5h8' },
      { mot: 'Pas encore', bouche: 'M7.5 17c1.2-2 2.7-3 4.5-3s3.3 1 4.5 3' },
    ];
    const r = this.state.reponses;
    return {
      questions: textes.map((texte, i) => ({
        texte,
        choix: visages.map((v, j) => ({
          ...v,
          classe: r[i] === j ? 'choisi' : '',
          presse: r[i] === j ? 'true' : 'false',
          choisir: () => this.setState({ reponses: r.map((x, k) => (k === i ? j : x)) }),
        })),
      })),
    };
  }
}
</script>
</body>
</html>
