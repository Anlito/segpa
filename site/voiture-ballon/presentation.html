        notes: "Bienvenue ! Aujourd’hui on découvre notre nouveau projet : une course de voitures qui avancent grâce à un ballon. Laisser les élèves réagir au titre et à l’image." },
      { style: "background:#F4F1EA;color:#1C2026;flex-direction:column;gap:56px;padding:128px",
        html: "<h2 style=\"font-size:80px;font-weight:800;line-height:1.1;color:#1C2026\">Notre mission</h2>\n<div style=\"display:flex;align-items:center;gap:72px\">\n<div style=\"width:300px;height:300px;border-radius:64px;background:#0F766E;display:flex;align-items:center;justify-content:center\"><svg aria-label=\"voiture\" width=\"200\" height=\"200\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#F5F3EE\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 15V11l3-4h9l3 4h2a1 1 0 011 1v3\"/><path d=\"M3 15h18\"/><circle cx=\"7\" cy=\"16.5\" r=\"2\"/><circle cx=\"17\" cy=\"16.5\" r=\"2\"/><path d=\"M8 7v4h9\"/></svg></div>\n<div style=\"display:flex;flex-direction:column;gap:40px;width:1200px\">\n<p style=\"font-size:64px;font-weight:700;line-height:1.2\">Construire une voiture qui avance avec un ballon.</p>\n<p style=\"font-size:56px;font-weight:700;line-height:1.2;color:#0F766E\">Puis faire la course !</p>\n</div></div>",
        notes: "Lire la mission ensemble, lentement. Montrer une vraie voiture à ballon si elle est prête." },
      { style: "background:#0F766E;color:#F5F3EE;flex-direction:column;justify-content:center;gap:48px;padding:128px",
        html: "<div style=\"position:absolute;left:0;top:0;width:1920px;height:28px\"><svg aria-hidden=\"true\" width=\"1920\" height=\"28\" viewBox=\"0 0 1920 28\"><defs><pattern id=\"d\" width=\"28\" height=\"28\" patternUnits=\"userSpaceOnUse\"><rect width=\"28\" height=\"28\" fill=\"#F5F3EE\"/><rect width=\"14\" height=\"14\" fill=\"#15171B\"/><rect x=\"14\" y=\"14\" width=\"14\" height=\"14\" fill=\"#15171B\"/></pattern></defs><rect width=\"1920\" height=\"28\" fill=\"url(#d)\"/></svg></div>\n<div style=\"width:200px;height:200px;border-radius:100px;background:#F5F3EE;display:flex;align-items:center;justify-content:center\"><svg aria-label=\"question\" width=\"130\" height=\"130\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#0F766E\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9.5\"/><path d=\"M9.5 9.5a2.5 2.5 0 015 0c0 1.7-2.5 2-2.5 4\"/><path d=\"M12 17h.01\"/></svg></div>\n<p style=\"font-size:88px;font-weight:800;line-height:1.15;color:#F5F3EE;width:1500px\">Comment une voiture peut-elle avancer avec un ballon ?</p>\n<p style=\"font-size:44px;font-weight:600;color:#CCFBF1\">On va le découvrir… et l’expliquer à la fin du projet.</p>",
        notes: "Recueillir les idées des élèves sans les corriger ni donner la réponse : à la fin du projet, chaque équipe répond par écrit à « Pourquoi ma voiture avance ? » (critère d’évaluation)." },
      { style: "background:#F4F1EA;color:#1C2026;flex-direction:column;gap:56px;padding:128px",
        html: "<h2 style=\"font-size:80px;font-weight:800;line-height:1.1;color:#1C2026\">Le matériel de mon équipe</h2>\n<div style=\"display:flex;gap:28px\">\n<div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:20px;background:#FFFFFF;padding:40px 24px;border-radius:32px;border:3px solid #D9D4C7\"><div style=\"width:150px;height:150px;border-radius:40px;background:#CCFBF1;display:flex;align-items:center;justify-content:center\"><svg aria-label=\"chassis\" width=\"96\" height=\"96\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#0F766E\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"9\" width=\"18\" height=\"6\" rx=\"1\"/><path d=\"M6 15v3M18 15v3M6 9V7M18 9V7\"/><circle cx=\"14\" cy=\"6\" r=\"2\"/></svg></div><h3 style=\"font-size:40px;font-weight:800;text-align:center\">Châssis</h3><p style=\"font-size:28px;text-align:center;color:#5B6170\">imprimé en 3D</p></div>\n<div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:20px;background:#FFFFFF;padding:40px 24px;border-radius:32px;border:3px solid #D9D4C7\"><div style=\"width:150px;height:150px;border-radius:40px;background:#CCFBF1;display:flex;align-items:center;justify-content:center\"><svg aria-label=\"pique\" width=\"96\" height=\"96\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#0F766E\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 21L21 3\"/><path d=\"M17 3h4v4\"/></svg></div><h3 style=\"font-size:40px;font-weight:800;text-align:center\">2 piques</h3><p style=\"font-size:28px;text-align:center;color:#5B6170\">les axes</p></div>\n<div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:20px;background:#FFFFFF;padding:40px 24px;border-radius:32px;border:3px solid #D9D4C7\"><div style=\"width:150px;height:150px;border-radius:40px;background:#CCFBF1;display:flex;align-items:center;justify-content:center\"><svg aria-label=\"roue\" width=\"96\" height=\"96\" viewB </div>\n<p style=\"font-size:36px;font-weight:600;color:#5B6170\">En plus : carton, scotch, feutres et crayons de couleur.</p>",
        notes: "Montrer chaque pièce du kit en vrai pendant qu’on la nomme. Le kit est donné à chaque binôme ; on le compte au début et à la fin de chaque séance." },
      { style: "background:#22262D;color:#F5F3EE;flex-direction:column;gap:56px;padding:128px",
        html: "<div style=\"position:absolute;left:0;top:0;width:1920px;height:28px\"><svg aria-hidden=\"true\" width=\"1920\" height=\"28\" viewBox=\"0 0 1920 28\"><defs><pattern id=\"d\" width=\"28\" height=\"28\" patternUnits=\"userSpaceOnUse\"><rect width=\"28\" height=\"28\" fill=\"#F5F3EE\"/><rect width=\"14\" height=\"14\" fill=\"#15171B\"/><rect x=\"14\" y=\"14\" width=\"14\" height=\"14\" fill=\"#15171B\"/></pattern></defs><rect width=\"1920\" height=\"28\" fill=\"url(#d)\"/></svg></div>\n<div style=\"position:absolute;left:0;top:640px;width:1920px;height:200px;background:#3A3F48\"></div>\n<div style=\"position:absolute;left:0;top:640px;width:1920px;height:20px\"><svg aria-hidden=\"true\" width=\"1920\" height=\"20\" viewBox=\"0 0 1920 20\"><defs><pattern id=\"b\" width=\"96\" height=\"20\" patternUnits=\"userSpaceOnUse\"><rect width=\"48\" height=\"20\" fill=\"#F97316\"/><rect x=\"48\" width=\"48\" height=\"20\" fill=\"#F5F3EE\"/></pattern></defs><rect width=\"1920\" height=\"20\" fill=\"url(#b)\"/></svg></div>\n<div style=\"position:absolute;left:0;top:820px;width:1920px;height:20px\"><svg aria-hidden=\"true\" width=\"1920\" height=\"20\" viewBox=\"0 0 1920 20\"><defs><pattern id=\"b\" width=\"96\" height=\"20\" patternUnits=\"userSpaceOnUse\"><rect width=\"48\" height=\"20\" fill=\"#F97316\"/><rect x=\"48\" width=\"48\" height=\"20\" fill=\"#F5F3EE\"/></pattern></defs><rect width=\"1920\" height=\"20\" fill=\"url(#b)\"/></svg></div>\n<h2 style=\"font-size:80px;font-weight:800;line-height:1.1;color:#F5F3EE\">Le projet en 6 séances</h2>\n<div style=\"display:flex;gap:24px\"><div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:18px;background:#F5F3EE;padding:36px 12px;border-radius:28px\">\n<p style=\"font-size:30px;font-weight:800;background:#15171B;color:#F5F3EE;padding:4px 20px;border-radius:14px;transform:skewX(-8deg)\">Séance 1</p>\n<div style=\"width:130px;height:130px;border-radius:36px;background:#0F766E;display:flex;align-i ext-align:center;color:#1C2026\">Je dessine</h3></div><div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:18px;background:#F5F3EE;padding:36px 12px;border-radius:28px\">\n<p style=\"font-size:30px;font-weight:800;background:#15171B;color:#F5F3EE;padding:4px 20px;border-radius:14px;transform:skewX(-8deg)\">Séance 4</p>\n<div style=\"width:130px;height:130px;border-radius:36px;background:#E7ECEB;display:flex;align-items:center;justify-content:center\"><svg aria-label=\"gabarit\" width=\"84\" height=\"84\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1C2026\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 3h10l4 4v14H5z\"/><path d=\"M9 9h6v8H9z\" stroke-dasharray=\"2 1.6\"/></svg></div>\n<h3 style=\"font-size:36px;font-weight:800;text-align:center;color:#1C2026\">Je fabrique</h3></div><div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:18px;background:#F5F3EE;padding:36px 12px;border-radius:28px\">\n<p style=\"font-size:30px;font-weight:800;background:#15171B;color:#F5F3EE;padding:4px 20px;border-radius:14px;transform:skewX(-8deg)\">Séance 5</p>\n<div style=\"width:130px;height:130px;border-radius:36px;background:#E7ECEB;display:flex;align-items:center;justify-content:center\"><svg aria-label=\"metre\" width=\"84\" height=\"84\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1C2026\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2.5\" y=\"7\" width=\"11\" height=\"11\" rx=\"2.5\"/><circle cx=\"8\" cy=\"12.5\" r=\"2\"/><path d=\"M13.5 15h8v3h-8\"/><path d=\"M17 15v1.5M19.5 15v1.5\"/></svg></div>\n<h3 style=\"font-size:36px;font-weight:800;text-align:center;color:#1C2026\">Je teste</h3></div><div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:18px;background:#F5F3EE;padding:36px 12px;border-radius:28px\">\n<p style=\"font-size:30px;font-weight:800;background:#15171B;color:#F5F3EE;padding:4px 20px;border-radius:14px;transform:skewX(-8deg)\">Séance 6</p>\n<div style=\"width:130px;height:130px;border-radius:36px;background:#E7ECEB;display:flex;align-items:center;justify-content:center\"><svg aria-label=\"drapeau\" width=\"84\" height=\"84\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1C2026\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 21V4\"/><path d=\"M5 4h12l-2 4 2 4H5\"/></svg></div>\n<h3 style=\"font-size:36px;font-weight:800;text-align:center;color:#1C2026\">La course</h3></div></div>",
        notes: "La frise est la même que l’écran « Ma mission » de l’ordinateur : les élèves la retrouveront à chaque séance." },
      { style: "background:#F4F1EA;color:#1C2026;flex-direction:column;gap:56px;padding:128px",
        html: "<div style=\"display:flex;align-items:center;gap:32px\">\n<p style=\"font-size:40px;font-weight:800;background:#15171B;color:#F5F3EE;padding:6px 26px;border-radius:16px;transform:skewX(-8deg)\">Séance 1</p>\n<h2 style=\"font-size:80px;font-weight:800;line-height:1.1;color:#1C2026\">Je prépare</h2></div>\n<div style=\"display:flex;align-items:center;gap:80px\">\n<div style=\"width:340px;height:340px;border-radius:72px;background:#0F766E;display:flex;align-items:center;justify-content:center\"><svg aria-label=\"boite\" width=\"220\" height=\"220\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#F5F3EE\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 9l9-4 9 4v9l-9 4-9-4z\"/><path d=\"M3 9l9 4 9-4\"/><path d=\"M12 13v9\"/></svg></div>\n<div style=\"display:flex;flex-direction:column;gap:44px\"><div style=\"display:flex;align-items:center;gap:28px\"><div style=\"width:20px;height:20px;border-radius:10px;background:#F97316\"></div><p style=\"font-size:52px;font-weight:700;line-height:1.2;width:1050px\">Je choisis le nom de ma voiture.</p></div><div style=\"display:flex;align-items:center;gap:28px\"><div style=\"width:20px;height:20px;border-radius:10px;background:#F97316\"></div><p style=\"font-size:52px;font-weight:700;line-height:1.2;width:1050px\">Je choisis la couleur de mon équipe.</p></div><div style=\"display:flex;align-items:center;gap:28px\"><div style=\"width:20px;height:20px;border-radius:10px;background:#F97316\"></div><p style=\"font-size:52px;font-weight:700;line-height:1.2;width:1050px\">Je compte mon matériel.</p></div></div></div>",
        notes: "Le nom et la couleur suivent la voiture jusqu’au podium. Les élèves comptent leur kit à l’écran avec les boutons − et +." },
      { style: "background:#F4F1EA;color:#1C2026;flex-direction:column;gap:56px;padding:128px",
        html: "<div style=\"display:flex;align-items:center;gap:32px\">\n<p style=\"font-size:40px;font-weight:800;background:#15171B;color:#F5F3EE;padding:6px 26px;border-radius:16px;transform:skewX(-8deg)\">Séance 2</p>\n<h2 style=\"font-size:80px;font-weight:800;line-height:1.1;color:#1C2026\">Je construis</h2></div>\n<div style=\"display:flex;align-items:center;gap:80px\">\n<div style=\"width:340px;height:340px;border-radius:72px;background:#0F766E;display:flex;align-items:center;justify-content:center\"><svg aria-label=\"chassis\" width=\"220\" height=\"220\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#F5F3EE\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"9\" width=\"18\" height=\"6\" rx=\"1\"/><path d=\"M6 15v3M18 15v3M6 9V7M18 9V7\"/><circle cx=\"14\" cy=\"6\" r=\"2\"/></svg></div>\n<div style=\"display:flex;flex-direction:column;gap:44px\"><div style=\"display:flex;align-items:center;gap:28px\"><div style=\"width:20px;height:20px;border-radius:10px;background:#F97316\"></div><p style=\"font-size:52px;font-weight:700;line-height:1.2;width:1050px\">Je monte les roues sur les piques.</p></div><div style=\"display:flex;align-items:center;gap:28px\"><div style=\"width:20px;height:20px;border-radius:10px;background:#F97316\"></div><p style=\"font-size:52px;font-weight:700;line-height:1.2;width:1050px\">J’enfile le ballon sur le tube.</p></div><div style=\"display:flex;align-items:center;gap:28px\"><div style=\"width:20px;height:20px;border-radius:10px;background:#F97316\"></div><p style=\"font-size:52px;font-weight:700;line-height:1.2;width:1050px\">Je vérifie : les roues tournent.</p></div></div></div>",
        notes: "Une étape à la fois, avec la photo du professeur à l’écran. Si la voiture ne roule pas, le bouton « Ma voiture ne roule pas » ramène à la bonne étape." },
      { style: "background:#F4F1EA;color:#1C2026;flex-direction:column;gap:56px;padding:128px",
        html: "<div style=\"display:flex;align-items:center;gap:32px\">\n<p style=\"font-size:40px;font-weight:800;background:#15171B;color:#F5F3EE;padding:6px 26px;border-radius:16px;transform:skewX(-8deg)\">Séance 3</p>\n<h2 style=\"font-size:80px;font-weight:800;line-height:1.1;color:#1C2026\">Je dessine</h2></div>\n<div style=\"display:flex;align-items:center;gap:80px\">\n<div style=\"width:340px;height:340px;border-radius:72px;background:#0F766E;display:flex;align-items:center;justify-content:center\"><svg aria-label=\"crayon\" width=\"220\" height=\"220\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#F5F3EE\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 20l4-1 11-11-3-3L5 16z\"/><path d=\"M14 7l3 3\"/></svg></div>\n<div style=\"display:flex;flex-direction:column;gap:44px\"><div style=\"display:flex;align-items:center;gap:28px\"><div style=\"width:20px;height:20px;border-radius:10px;background:#F97316\"></div><p style=\"font-size:52px;font-weight:700;line-height:1.2;width:1050px\">Je décore ma carrosserie à l’ordinateur.</p></div><div style=\"display:flex;align-items:center;gap:28px\"><div style=\"width:20px;height:20px;border-radius:10px;background:#F97316\"></div><p style=\"font-size:52px;font-weight:700;line-height:1.2;width:1050px\">Tampons, nom, numéro, couleurs.</p></div><div style=\"display:flex;align-items:center;gap:28px\"><div style=\"width:20px;height:20px;border-radius:10px;background:#F97316\"></div><p style=\"font-size:52px;font-weight:700;line-height:1.2;width:1050px\">La machine la découpe pour moi.</p></div></div></div>",
        notes: "L’atelier « Je dessine ma carrosserie » : la Cricut trace le dessin au stylo puis découpe la carrosserie sur une feuille cartonnée, entre la séance 3 et la séance 4." },
      { style: "background:#F4F1EA;color:#1C2026;flex-direction:column;gap:56px;padding:128px",
        html: "<div style=\"display:flex;align-items:center;gap:32px\">\n<p style=\"font-size:40px;font-weight:800;background:#15171B;color:#F5F3EE;padding:6px 26px;border-radius:16px;transform:skewX(-8deg)\">Séance 4</p>\n<h2 style=\"font-size:80px;font-weight:800;line-height:1.1;color:#1C2026\">Je fabrique</h2></div>\n<div style=\"display:flex;align-items:center;gap:80px\">\n<div style=\"width:340px;height:340px;border-radius:72px;background:#0F766E;display:flex;align-items:center;justify-content:center\"><svg aria-label=\"gabarit\" width=\"220\" height=\"220\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#F5F3EE\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 3h10l4 4v14H5z\"/><path d=\"M9 9h6v8H9z\" stroke-dasharray=\"2 1.6\"/></svg></div>\n<div style=\"display:flex;flex-direction:column;gap:44px\"><div style=\"display:flex;align-items:center;gap:28px\"><div style=\"width:20px;height:20px;border-radius:10px;background:#F97316\"></div><p style=\"font-size:52px;font-weight:700;line-height:1.2;width:1050px\">Je colorie, je plie, je colle.</p></div><div style=\"display:flex;align-items:center;gap:28px\"><div style=\"width:20px;height:20px;border-radius:10px;background:#F97316\"></div><p style=\"font-size:52px;font-weight:700;line-height:1.2;width:1050px\">Je l’installe sur ma voiture.</p></div><div style=\"display:flex;align-items:center;gap:28px\"><div style=\"width:20px;height:20px;border-radius:10px;background:#F97316\"></div><p style=\"font-size:52px;font-weight:700;line-height:1.2;width:1050px\">Un aileron ? Des protège-roues ? Si je veux !</p></div></div></div>",
        notes: "La carrosserie se fixe dans les fentes du châssis, languettes scotchées dessous. Les éléments en plus sont faits à la main, légers, sans gêner les roues." },
      { style: "background:#F4F1EA;color:#1C2026;flex-direction:column;gap:56px;padding:128px",
        html: "<div style=\"display:flex;align-items:center;gap:32px\">\n<p style=\"font-size:40px;font-weight:800;background:#15171B;color:#F5F3EE;padding:6px 26px;border-radius:16px;transform:skewX(-8deg)\">Séance 5</p>\n<h2 style=\"font-size:80px;font-weight:800;line-height:1.1;color:#1C2026\">Je teste</h2></div>\n<div style=\"display:flex;align-items:center;gap:80px\">\n<div style=\"width:340px;height:340px;border-radius:72px;background:#0F766E;display:flex;align-items:center;justify-content:center\"><svg aria-label=\"metre\" width=\"220\" height=\"220\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#F5F3EE\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2.5\" y=\"7\" width=\"11\" height=\"11\" rx=\"2.5\"/><circle cx=\"8\" cy=\"12.5\" r=\"2\"/><path d=\"M13.5 15h8v3h-8\"/><path d=\"M17 15v1.5M19.5 15v1.5\"/></svg></div>\n<div style=\"display:flex;flex-direction:column;gap:44px\"><div style=\"display:flex;align-items:center;gap:28px\"><div style=\"width:20px;height:20px;border-radius:10px;background:#F97316\"></div><p style=\"font-size:52px;font-weight:700;line-height:1.2;width:1050px\">Je lâche ma voiture et je mesure.</p></div><div style=\"display:flex;align-items:center;gap:28px\"><div style=\"width:20px;height:20px;border-radius:10px;background:#F97316\"></div><p style=\"font-size:52px;font-weight:700;line-height:1.2;width:1050px\">Je change une seule chose.</p></div><div style=\"display:flex;align-items:center;gap:28px\"><div style=\"width:20px;height:20px;border-radius:10px;background:#F97316\"></div><p style=\"font-size:52px;font-weight:700;line-height:1.2;width:1050px\">Je recommence : est-ce mieux ?</p></div></div></div>",
        notes: "Deux essais au moins. On mesure au mètre ruban, en centimètres. Entre deux essais, on change UNE seule chose (les roues, le gonflage ou le poids) pour savoir ce qui marche." },
      { style: "background:#F4F1EA;color:#1C2026;flex-direction:column;gap:56px;padding:128px",
        html: "<div style=\"display:flex;align-items:center;gap:32px\">\n<p style=\"font-size:40px;font-weight:800;background:#15171B;color:#F5F3EE;padding:6px 26px;border-radius:16px;transform:skewX(-8deg)\">Séance 6</p>\n<h2 style=\"font-size:80px;font-weight:800;line-height:1.1;color:#1C2026\">La course</h2></div>\n<div style=\"display:flex;align-items:center;gap:80px\">\n<div style=\"width:340px;height:340px;border-radius:72px;background:#0F766E;display:flex;align-items:center;justify-content:center\"><svg aria-label=\"drapeau\" width=\"220\" height=\"220\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#F5F3EE\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 21V4\"/><path d=\"M5 4h12l-2 4 2 4H5\"/></svg></div>\n<div style=\"display:flex;flex-direction:column;gap:44px\"><div style=\"display:flex;align-items:center;gap:28px\"><div style=\"width:20px;height:20px;border-radius:10px;background:#F97316\"></div><p style=\"font-size:52px;font-weight:700;line-height:1.2;width:1050px\">Des courses de 2 à 4 voitures.</p></div><div style=\"display:flex;align-items:center;gap:28px\"><div style=\"width:20px;height:20px;border-radius:10px;background:#F97316\"></div><p style=\"font-size:52px;font-weight:700;line-height:1.2;width:1050px\">Tout le monde court au moins 2 fois.</p></div><div style=\"display:flex;align-items:center;gap:28px\"><div style=\"width:20px;height:20px;border-radius:10px;background:#F97316\"></div><p style=\"font-size:52px;font-weight:700;line-height:1.2;width:1050px\">Un podium et le record de la classe !</p></div></div></div>",
        notes: "Des poules, puis des finales par niveau : personne n’est éliminé. Le classement n’entre pas dans la note." },
      { style: "background:#22262D;color:#F5F3EE;flex-direction:column;gap:56px;padding:128px",
        html: "<div style=\"position:absolute;left:0;top:0;width:1920px;height:28px\"><svg aria-hidden=\"true\" width=\"1920\" height=\"28\" viewBox=\"0 0 1920 28\"><defs><pattern id=\"d\" width=\"28\" height=\"28\" patternUnits=\"userSpaceOnUse\"><rect width=\"28\" height=\"28\" fill=\"#F5F3EE\"/><rect width=\"14\" height=\"14\" fill=\"#15171B\"/><rect x=\"14\" y=\"14\" width=\"14\" height=\"14\" fill=\"#15171B\"/></pattern></defs><rect width=\"1920\" height=\"28\" fill=\"url(#d)\"/></svg></div>\n<h2 style=\"font-size:80px;font-weight:800;line-height:1.1;color:#F5F3EE\">Nos règles</h2>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:32px\">\n<div style=\"display:flex;align-items:center;gap:36px;background:#F5F3EE;padding:32px 40px;border-radius:32px\"><div style=\"width:130px;height:130px;border-radius:65px;background:#FFEDD5;display:flex;align-items:center;justify-content:center;flex:none\"><svg aria-label=\"colle\" width=\"84\" height=\"84\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#9A3412\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 9h11l3 3-3 3H4z\"/><path d=\"M18 12h3\"/><path d=\"M8 15v5\"/><path d=\"M11 9V6h-4v3\"/></svg></div><div style=\"display:flex;flex-direction:column;gap:8px\"><p style=\"font-size:42px;font-weight:800;color:#1C2026;line-height:1.2\">La colle chaude : avec le professeur.</p><p style=\"font-size:30px;color:#5B6170\">Elle brûle : je ne la touche pas.</p></div></div>\n<div style=\"display:flex;align-items:center;gap:36px;background:#F5F3EE;padding:32px 40px;border-radius:32px\"><div style=\"width:130px;height:130px;border-radius:65px;background:#FFEDD5;display:flex;align-items:center;justify-content:center;flex:none\"><svg aria-label=\"ciseaux\" width=\"84\" height=\"84\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#9A3412\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"6\" cy=\"17\" r=\"3\"/><circle cx=\"6\" cy=\"7\" r=\"3\"/><path d=\"M8.5 15.5L20 5\"/><path d=\"M8.5 8.5L20 19\"/></svg></div><div style=\"display:flex;flex-direction:column;gap:8px\"><p style=\"font-size:42px;font-weight:800;color:#1C2026;line-height:1.2\">Je coupe doucement.</p><p style=\"font-size:30px;color:#5B6170\">Les doigts loin de la lame.</p></div></div>\n<div style=\"display:flex;align-items:center;gap:36px;background:#F5F3EE;padding:32px 40px;border-radius:32px\"><div style=\"width:130px;height:130px;border-radius:65px;background:#FFEDD5;display:flex;align-items:center;justify-content:center;flex:none\"><svg aria-label=\"pompe\" width=\"84\" height=\"84\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#9A3412\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 3h6\"/><path d=\"M12 3v4\"/><rect x=\"8\" y=\"7\" width=\"8\" height=\"12\" rx=\"1.5\"/><path d=\"M6 21h12\"/><path d=\"M16 11h3v-3\"/></svg></div><div style=\"display:flex;flex-direction:column;gap:8px\"><p style=\"font-size:42px;font-weight:800;color:#1C2026;line-height:1.2\">Je gonfle avec la pompe.</p><p style=\"font-size:30px;color:#5B6170\">Personne ne souffle dans le ballon.</p></div></div>\n<div style=\"display:flex;align-items:center;gap:36px;background:#F5F3EE;padding:32px 40px;border-radius:32px\"><div style=\"width:130px;height:130px;border-radius:65px;background:#FFEDD5;display:flex;align-items:center;justify-content:center;flex:none\"><svg aria-label=\"balai\" width=\"84\" height=\"84\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#9A3412\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 3l-4 9\"/><path d=\"M6 12h9l2 9H4z\"/><path d=\"M8.5 16v5M12.5 16v5\"/></svg></div><div style=\"display:flex;flex-direction:column;gap:8px\"><p style=\"font-size:42px;font-weight:800;color:#1C2026;line-height:1.2\">Je range avant de partir.</p><p style=\"font-size:30px;color:#5B6170\">Mon matériel est compté.</p></div></div>\n</div>",
        notes: "Les mêmes règles reviennent à l’écran au début des séances (« J’ai compris »)." },
      { style: "background:#F4F1EA;color:#1C2026;flex-direction:column;gap:56px;padding:128px",
        html: "<h2 style=\"font-size:80px;font-weight:800;line-height:1.1;color:#1C2026\">Comment on travaille</h2>\n<div style=\"display:flex;gap:32px\">\n<div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:28px;background:#FFFFFF;padding:48px 24px;border-radius:32px;border:3px solid #D9D4C7\"><div style=\"width:170px;height:170px;border-radius:85px;background:#0F766E;display:flex;align-items:center;justify-content:center\"><svg aria-label=\"maison\" width=\"110\" height=\"110\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#F5F3EE\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 11l9-8 9 8\"/><path d=\"M5 10v10h5v-6h4v6h5V10\"/></svg></div><p style=\"font-size:40px;font-weight:800;text-align:center;line-height:1.2\">Ma mission à l’ordinateur</p></div>\n<div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:28px;background:#FFFFFF;padding:48px 24px;border-radius:32px;border:3px solid #D9D4C7\"><div style=\"width:170px;height:170px;border-radius:85px;background:#0F766E;display:flex;align-items:center;justify-content:center\"><svg aria-label=\"voiture\" width=\"110\" height=\"110\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#F5F3EE\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 15V11l3-4h9l3 4h2a1 1 0 011 1v3\"/><path d=\"M3 15h18\"/><circle cx=\"7\" cy=\"16.5\" r=\"2\"/><circle cx=\"17\" cy=\"16.5\" r=\"2\"/><path d=\"M8 7v4h9\"/></svg></div><p style=\"font-size:40px;font-weight:800;text-align:center;line-height:1.2\">En binôme, une voiture</p></div>\n<div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:28px;background:#FFFFFF;padding:48px 24px;border-radius:32px;border:3px solid #D9D4C7\"><div style=\"width:170px;height:170px;border-radius:85px;background:#0F766E;display:flex;align-items:center;justify-content:center\"><svg aria-label=\"photo\" width=\"110\" height=\"110\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#F5F3EE\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 8h3l2-3h6l2 3h3v11H4z\"/><circle cx=\"12\" cy=\"13\" r=\"4\"/></svg></div><p style=\"font-size:40px;font-weight:800;text-align:center;line-height:1.2\">Je prends des photos</p></div>\n<div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:28px;background:#FFFFFF;padding:48px 24px;border-radius:32px;border:3px solid #D9D4C7\"><div style=\"width:170px;height:170px;border-radius:85px;background:#0F766E;display:flex;align-items:center;justify-content:center\"><svg aria-label=\"aide\" width=\"110\" height=\"110\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#F5F3EE\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 13V6a1.5 1.5 0 013 0v5\"/><path d=\"M11 11V4a1.5 1.5 0 013 0v7\"/><path d=\"M14 11V5.5a1.5 1.5 0 013 0V12\"/><path d=\"M17 10a1.5 1.5 0 013 0v5a7 7 0 01-7 7h-1a7 7 0 01-5.6-2.8L3 15.5a1.6 1.6 0 012.4-2L8 16\"/></svg></div><p style=\"font-size:40px;font-weight:800;text-align:center;line-height:1.2\">Bouton Aide : le professeur vient</p></div>\n</div>",
        notes: "Chaque binôme a son dossier sur le réseau : son travail et ses photos y sont enregistrés. Le bouton 🔊 lit les consignes à voix haute." },
      { style: "background:#22262D;color:#F5F3EE;flex-direction:column;align-items:center;gap:24px;padding:180px 128px 128px",
        html: "<div style=\"position:absolute;left:0;top:0;width:1920px;height:28px\"><svg aria-hidden=\"true\" width=\"1920\" height=\"28\" viewBox=\"0 0 1920 28\"><defs><pattern id=\"d\" width=\"28\" height=\"28\" patternUnits=\"userSpaceOnUse\"><rect width=\"28\" height=\"28\" fill=\"#F5F3EE\"/><rect width=\"14\" height=\"14\" fill=\"#15171B\"/><rect x=\"14\" y=\"14\" width=\"14\" height=\"14\" fill=\"#15171B\"/></pattern></defs><rect width=\"1920\" height=\"28\" fill=\"url(#d)\"/></svg></div>\n<div style=\"position:absolute;left:0;bottom:0;width:1920px;height:260px;background:#2F343C\"></div>\n<div style=\"position:absolute;left:0;bottom:240px;width:1920px;height:20px\"><svg aria-hidden=\"true\" width=\"1920\" height=\"20\" viewBox=\"0 0 1920 20\"><defs><pattern id=\"b\" width=\"96\" height=\"20\" patternUnits=\"userSpaceOnUse\"><rect width=\"48\" height=\"20\" fill=\"#F97316\"/><rect x=\"48\" width=\"48\" height=\"20\" fill=\"#F5F3EE\"/></pattern></defs><rect width=\"1920\" height=\"20\" fill=\"url(#b)\"/></svg></div>\n<div style=\"position:absolute;left:1240px;bottom:72px;width:440px;height:180px\"><svg aria-label=\"Une voiture à ballon\" width=\"440\" height=\"180\" viewBox=\"0 0 220 90\"><path d=\"M62 50C58 34 50 20 52 8\" fill=\"none\" stroke=\"#E5E7EB\" stroke-width=\"1.6\"/><ellipse cx=\"52\" cy=\"10\" rx=\"16\" ry=\"19\" fill=\"#FBBF24\" stroke=\"#111\" stroke-width=\"2.5\"/><path d=\"M12 66L44 58 78 54 104 40 128 40 144 54 190 56 206 62 206 70 12 70Z\" fill=\"#1D4ED8\" stroke=\"#111\" stroke-width=\"3\" stroke-linejoin=\"round\"/><rect x=\"6\" y=\"40\" width=\"16\" height=\"26\" rx=\"2\" fill=\"#111\"/><circle cx=\"116\" cy=\"42\" r=\"8\" fill=\"#F5F5F5\" stroke=\"#111\" stroke-width=\"3\"/><circle cx=\"152\" cy=\"62\" r=\"7\" fill=\"#F5F5F5\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"50\" cy=\"72\" r=\"15\" fill=\"#111\"/><circle cx=\"50\" cy=\"72\" r=\"5\" fill=\"#9CA3AF\"/><circle cx=\"172\" cy=\"72\" r=\"15\" fill=\"#111\"/><circle cx=\"172\" cy=\"72\" r=\"5\" fill=\"#9CA3AF\"/></svg></div>\n<div style=\"position:absolute;left:300px;bottom:72px;width:440px;height:180px\"><svg aria-label=\"Une voiture à ballon\" width=\"440\" height=\"180\" viewBox=\"0 0 220 90\"><path d=\"M62 50C58 34 50 20 52 8\" fill=\"none\" stroke=\"#E5E7EB\" stroke-width=\"1.6\"/><ellipse cx=\"52\" cy=\"10\" rx=\"16\" ry=\"19\" fill=\"#F472B6\" stroke=\"#111\" stroke-width=\"2.5\"/><path d=\"M12 66L44 58 78 54 104 40 128 40 144 54 190 56 206 62 206 70 12 70Z\" fill=\"#F97316\" stroke=\"#111\" stroke-width=\"3\" stroke-linejoin=\"round\"/><rect x=\"6\" y=\"40\" width=\"16\" height=\"26\" rx=\"2\" fill=\"#111\"/><circle cx=\"116\" cy=\"42\" r=\"8\" fill=\"#F5F5F5\" stroke=\"#111\" stroke-width=\"3\"/><circle cx=\"152\" cy=\"62\" r=\"7\" fill=\"#F5F5F5\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"50\" cy=\"72\" r=\"15\" fill=\"#111\"/><circle cx=\"50\" cy=\"72\" r=\"5\" fill=\"#9CA3AF\"/><circle cx=\"172\" cy=\"72\" r=\"15\" fill=\"#111\"/><circle cx=\"172\" cy=\"72\" r=\"5\" fill=\"#9CA3AF\"/></svg></div>\n<p style=\"font-size:56px;font-weight:700;color:#14B8A6\">À vos voitures…</p>\n<h1 style=\"font-size:150px;font-weight:800;line-height:1.05;color:#F5F3EE\">Prêts ? Partez !</h1>",
        notes: "On ouvre « Ma mission » et on commence la séance 1." }
